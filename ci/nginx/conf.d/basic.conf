sendfile on;
tcp_nopush on;
tcp_nodelay on;
keepalive_timeout 65;

#
#  Stated rather than left to the compiled default, because the test harness
#  matches it. dapman-http-unit counts requests per connection and reopens the
#  connection when it reaches this number, so that a connection the server
#  closes at any other point fails the test instead of passing quietly. That
#  rock holds the matching value in max_requests_per_conn, and the two values
#  change together.
#
keepalive_requests 1000;
types_hash_max_size 2048;

default_type application/octet-stream;
