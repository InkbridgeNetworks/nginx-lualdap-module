# The `ldap-pooled` endpoint copies the connection lifecycle of dapman
# (SubMan `src/dapman/ldap.lua`, `ldap:get_connection`): the cosocket returns
# to the nginx keepalive pool, the lualdap connection is cached by fd in a
# per-worker table, and `conn:close()` is never called. The `mode` argument
# selects how the request ends.
#
#   mode=pool  Call `setkeepalive(0)` after the search. The healthy path.
#   mode=drop  Return without `setkeepalive`. Every dapman error path returns
#              without `setkeepalive`, so the cosocket closes with the request
#              while the connection object stays cached for that fd.
#   mode=gc    No LDAP. Run a full `collectgarbage()`, so the collector
#              finalizes any connection object that lost the `fd_map` slot.
#
# A drop followed by a fresh cosocket on the same fd leaves the first
# connection object unreferenced, holding a pointer to a freed
# `ngx_connection_t`. See tests/pooled_gc.lua.
location = /ldap-pooled {
    default_type    application/json;

    content_by_lua_block {
        local lualdap = require("ngx_lualdap")
        local cjson   = require("cjson")

        local mode = ngx.var.arg_mode or "pool"

        if mode == "gc" then
            local kb_before = collectgarbage("count")
            collectgarbage("collect")
            ngx.say(cjson.encode({ ok = true, mode = mode, kb_before = kb_before, kb_after = collectgarbage("count") }))
            return
        end

        local ldap_host = ngx.var.arg_host or "127.0.0.1"
        local ldap_port = tonumber(ngx.var.arg_port) or 1389
        local ldap_bind = ngx.var.arg_bind or "cn=manager,dc=example,dc=org"
        local ldap_pass = ngx.var.arg_pass or "password"
        local ldap_base = ngx.var.arg_base or "dc=example,dc=org"

        local sock = ngx.socket.tcp()
        sock:settimeout(tonumber(ngx.var.arg_timeout) or 5000)

        local ok, err = sock:connect(ldap_host, ldap_port)
        if not ok then
            ngx.status = 502
            ngx.say(cjson.encode({ ok = false, err = "connect: " .. err }))
            return
        end

        -- 1. Look the cosocket's fd up in the per-worker cache, as dapman
        --    does. A pooled cosocket has reusedtimes > 0 and its connection
        --    object is already bound.
        local fd     = lualdap.get_fd(sock)
        local reused = sock:getreusedtimes()
        local conn   = lualdap_pooled_fd_map[fd]
        local fresh  = reused == 0 or conn == nil

        -- 2. A fresh cosocket gets a new connection object and a bind. The
        --    object previously cached for this fd, if any, is now garbage.
        if fresh then
            conn = lualdap.init()
            local ok, err = conn:init_fd(sock, ldap_bind, ldap_pass, reused == 0)
            if not ok then
                ngx.status = 502
                ngx.say(cjson.encode({ ok = false, err = "bind: " .. tostring(err) }))
                return
            end
            lualdap_pooled_fd_map[fd] = conn
        end

        -- 3. One base search so the connection has done real work.
        local ok, iter_or_err = pcall(conn.search, conn, sock, ldap_base, "(objectClass=*)", "base", nil, {})
        if not ok then
            ngx.status = 500
            ngx.say(cjson.encode({ ok = false, err = tostring(iter_or_err) }))
            return
        end
        local iter    = iter_or_err
        local entries = 0
        while true do
            local dn, attrs = iter()
            if dn == nil then
                if attrs ~= nil then
                    ngx.status = 500
                    ngx.say(cjson.encode({ ok = false, err = attrs }))
                    return
                end
                break
            end
            entries = entries + 1
        end

        -- 4. pool returns the cosocket to the keepalive pool. drop lets it
        --    close with the request, which is what dapman's error paths do.
        if mode == "pool" then
            sock:setkeepalive(0)
        end

        ngx.say(cjson.encode({ ok = true, mode = mode, fd = fd, reused = reused, fresh = fresh, entries = entries }))
    }
}
