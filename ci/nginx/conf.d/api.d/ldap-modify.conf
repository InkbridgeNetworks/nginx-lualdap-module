location = /ldap-modify {
    default_type    application/json;

    content_by_lua_block {
        local lualdap = require("ngx_lualdap")
        local cjson   = require("cjson")

        local ldap_host = ngx.var.arg_host or "127.0.0.1"
        local ldap_port = tonumber(ngx.var.arg_port) or 1389
        local ldap_bind = ngx.var.arg_bind or "cn=manager,dc=example,dc=org"
        local ldap_pass = ngx.var.arg_pass or "password"
        local dn        = ngx.var.arg_dn
        local attr      = ngx.var.arg_attr
        local val       = ngx.var.arg_val
        -- `type` picks the Lua value that the handler builds from `val`, so
        -- a test can send the binding each value shape: string (default),
        -- number, boolean, null, list (`val` split on commas), or object
        -- (a table with `val` as a named key).
        local val_type  = ngx.var.arg_type or "string"

        if not dn or not attr or (not val and val_type ~= "null") then
            ngx.status = 400
            ngx.say(cjson.encode({ ok = false, err = "dn, attr, and val are required" }))
            return
        end

        if val_type == "number" then
            val = tonumber(val)
        elseif val_type == "boolean" then
            val = (val == "true")
        elseif val_type == "null" then
            val = cjson.null
        elseif val_type == "list" then
            local list = {}
            for item in string.gmatch(val, "[^,]+") do
                list[#list + 1] = item
            end
            val = list
        elseif val_type == "object" then
            val = { [val] = "x" }
        end

        local sock = ngx.socket.tcp()
        sock:settimeout(5000)

        local ok, err = sock:connect(ldap_host, ldap_port)
        if not ok then
            ngx.status = 502
            ngx.say(cjson.encode({ ok = false, err = "connect: " .. err }))
            return
        end

        local conn = lualdap.init()
        local ok, err = conn:init_fd(sock, ldap_bind, ldap_pass, true)
        if not ok then
            ngx.status = 502
            ngx.say(cjson.encode({ ok = false, err = "bind: " .. tostring(err) }))
            return
        end

        local mod = {"=", [attr] = val}
        local called, result_fn
        -- The binding raises on a value it cannot store, so the call runs
        -- under pcall and the raise becomes a 400 that names the cause.
        if ngx.var.arg_proxy_id or ngx.var.arg_noop then
            called, result_fn = pcall(conn.modify, conn, sock, dn, mod, { proxy_id = ngx.var.arg_proxy_id, noop = ngx.var.arg_noop == "1" })
        else
            called, result_fn = pcall(conn.modify, conn, sock, dn, mod)
        end
        if not called then
            ngx.status = 400
            ngx.say(cjson.encode({ ok = false, err = tostring(result_fn) }))
            conn:close()
            return
        end
        local ok, err, code = result_fn()
        if not ok then
            ngx.status = 500
            ngx.say(cjson.encode({ ok = false, err = tostring(err), code = code }))
            conn:close()
            return
        end

        conn:close()
        ngx.say(cjson.encode({ ok = true }))
    }
}
