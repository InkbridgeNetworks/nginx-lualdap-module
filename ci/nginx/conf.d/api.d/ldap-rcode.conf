location = /ldap-rcode {
    default_type    application/json;

    content_by_lua_block {
        local lualdap = require("ngx_lualdap")
        local cjson   = require("cjson")

        -- cjson refuses a sparse array, so the by_number table goes out
        -- with string keys.
        local by_number = {}
        for code, name in pairs(lualdap.rcode.by_number) do
            by_number[tostring(code)] = name
        end

        ngx.say(cjson.encode({ ok = true, rcode = { by_name = lualdap.rcode.by_name, by_number = by_number } }))
    }
}
